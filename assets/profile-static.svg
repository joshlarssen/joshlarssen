<svg width="1200" height="940" viewBox="0 0 1200 940" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="940" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030703" />
      <stop offset="1" stop-color="#071109" />
    </linearGradient>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="3" fill="#0E200F" opacity="0.2" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style><![CDATA[
      .page, .page * {
        box-sizing: border-box;
      }

      .page {
        width: 1136px;
        height: 876px;
        padding: 18px;
        color: #9dff7b;
        font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
      }

      .panel-surface {
        border: 1px solid #2f9134;
        background: rgba(7, 19, 9, 0.94);
        box-shadow: inset 0 0 0 1px rgba(67, 183, 66, 0.12);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        padding: 18px 22px;
        border-radius: 18px 18px 0 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand-led {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: #6dff55;
        box-shadow: 0 0 18px rgba(109, 255, 85, 0.85);
      }

      .eyebrow {
        margin: 0;
        color: #62c964;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 11px;
      }

      .brand-title {
        margin: 2px 0 0;
        color: #6dff55;
        font-size: 28px;
        font-weight: 700;
        text-transform: lowercase;
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .tab {
        border: 1px solid #2f9134;
        background: rgba(7, 18, 8, 0.9);
        color: #9dff7b;
        padding: 10px 14px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 14px;
      }

      .tab.is-active {
        background: #6dff55;
        color: #041006;
      }

      .screen {
        display: grid;
        grid-template-columns: 292px minmax(0, 1fr);
        gap: 18px;
        padding: 18px;
        border-top: none;
      }

      .sidebar,
      .panel-frame,
      .dock {
        border: 1px solid rgba(76, 180, 80, 0.22);
      }

      .sidebar {
        padding: 18px;
        background: linear-gradient(180deg, rgba(15, 31, 16, 0.76), rgba(5, 13, 6, 0.92));
      }

      .sidebar-title {
        margin: 2px 0 0;
        color: #6dff55;
        font-size: 28px;
        font-weight: 700;
      }

      .item-list {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 14px;
        border: 1px solid #2f9134;
        background: rgba(7, 18, 8, 0.9);
        color: #9dff7b;
        font-size: 18px;
      }

      .item.is-active {
        background: #6dff55;
        color: #041006;
      }

      .item-index {
        color: #2f6a33;
      }

      .item.is-active .item-index {
        color: rgba(4, 16, 6, 0.75);
      }

      .panel-frame {
        min-height: 100%;
        padding: 22px;
        background: linear-gradient(180deg, rgba(8, 18, 8, 0.92), rgba(3, 8, 4, 0.96));
      }

      .panel-meta {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: flex-start;
      }

      .panel-title {
        margin: 2px 0 0;
        color: #6dff55;
        font-size: 56px;
        font-weight: 700;
        line-height: 1;
      }

      .panel-subtitle,
      .panel-copy,
      .panel-bullets {
        color: #62c964;
      }

      .panel-subtitle {
        margin: 14px 0 0;
        font-size: 22px;
        line-height: 1.4;
        max-width: 440px;
      }

      .panel-tag {
        padding: 8px 12px;
        border: 1px solid #2f9134;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        white-space: nowrap;
        color: #9dff7b;
        font-size: 16px;
      }

      .panel-body {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        gap: 28px;
        align-items: center;
        margin-top: 28px;
      }

      .radar-shell {
        display: grid;
        place-items: center;
      }

      .radar {
        position: relative;
        width: 212px;
        height: 212px;
        border-radius: 999px;
        border: 2px solid #6dff55;
      }

      .radar-ring,
      .radar-line,
      .radar-core {
        position: absolute;
      }

      .radar-ring {
        inset: 26px;
        border-radius: 999px;
        border: 1px solid #2f9134;
      }

      .radar-ring.inner {
        inset: 56px;
      }

      .radar-line.horizontal {
        top: calc(50% - 1px);
        left: 12px;
        right: 12px;
        height: 2px;
        background: rgba(76, 180, 80, 0.22);
      }

      .radar-line.vertical {
        left: calc(50% - 1px);
        top: 12px;
        bottom: 12px;
        width: 2px;
        background: rgba(76, 180, 80, 0.22);
      }

      .radar-core {
        inset: 50%;
        width: 88px;
        height: 88px;
        margin-left: -44px;
        margin-top: -44px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        border: 2px solid #6dff55;
        color: #6dff55;
        font-size: 34px;
        font-weight: 700;
        text-transform: uppercase;
        box-shadow: 0 0 24px rgba(102, 255, 68, 0.14);
      }

      .panel-copy {
        margin: 0;
        line-height: 1.7;
        font-size: 18px;
        max-width: 430px;
      }

      .panel-bullets {
        margin: 18px 0 0;
        padding-left: 18px;
        line-height: 1.8;
        font-size: 17px;
        max-width: 430px;
      }

      .dock {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 18px;
        margin-top: 18px;
        padding: 18px 20px;
        border-top: none;
      }

      .signal-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 12px;
      }

      .signal-card {
        padding: 14px;
        border: 1px solid rgba(76, 180, 80, 0.22);
        background: rgba(8, 18, 8, 0.72);
      }

      .signal-card strong {
        display: block;
        color: #6dff55;
        font-size: 22px;
        margin-bottom: 6px;
      }

      .signal-card span {
        display: block;
        color: #62c964;
        font-size: 14px;
        line-height: 1.4;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }

      .link-pill {
        display: inline-flex;
        align-items: center;
        padding: 10px 12px;
        border: 1px solid #2f9134;
        background: rgba(7, 18, 8, 0.9);
        color: #9dff7b;
        font-size: 16px;
      }

      .footer {
        display: flex;
        gap: 10px;
        padding: 12px 18px;
        border-top: none;
        border-radius: 0 0 18px 18px;
        color: #62c964;
        font-size: 15px;
      }

      .footer-separator {
        color: #2f6a33;
      }
    ]]></style>
  </defs>

  <rect x="14" y="14" width="1172" height="912" rx="18" fill="url(#bg)" stroke="#57FF3A" stroke-width="2" />
  <rect x="28" y="28" width="1144" height="884" rx="14" fill="#040904" stroke="#1D5724" stroke-width="1.5" />
  <rect x="28" y="28" width="1144" height="884" rx="14" fill="url(#scan)" opacity="0.85" />

  <foreignObject x="32" y="32" width="1136" height="876">
    <div xmlns="http://www.w3.org/1999/xhtml" class="page">
      <header class="topbar panel-surface">
        <div class="brand">
          <div class="brand-led"></div>
          <div>
            <p class="eyebrow">interactive profile</p>
            <h1 class="brand-title">retro terminal</h1>
          </div>
        </div>

        <div class="tabs">
        <div class="tab is-active">skills</div>
      
        <div class="tab">builds</div>
      
        <div class="tab">signal</div>
      
        <div class="tab">links</div>
      </div>
      </header>

      <main class="screen panel-surface">
        <aside class="sidebar">
          <div>
            <p class="eyebrow">module items</p>
            <h2 class="sidebar-title">skill badges</h2>
          </div>

          <div class="item-list">
        <div class="item is-active">
          <span>python</span>
          <span class="item-index">01</span>
        </div>
      
        <div class="item">
          <span>javascript</span>
          <span class="item-index">02</span>
        </div>
      
        <div class="item">
          <span>docker</span>
          <span class="item-index">03</span>
        </div>
      
        <div class="item">
          <span>kubernetes</span>
          <span class="item-index">04</span>
        </div>
      
        <div class="item">
          <span>jenkins</span>
          <span class="item-index">05</span>
        </div>
      </div>
        </aside>

        <section class="panel">
          <div class="panel-frame">
            <div class="panel-meta">
              <div>
                <p class="eyebrow">active module</p>
                <h2 class="panel-title">Python</h2>
                <p class="panel-subtitle">Automation, tooling and framework work</p>
              </div>

              <div class="panel-tag">primary</div>
            </div>

            <div class="panel-body">
              <div class="radar-shell">
                <div class="radar">
                  <div class="radar-ring"></div>
                  <div class="radar-ring inner"></div>
                  <div class="radar-line horizontal"></div>
                  <div class="radar-line vertical"></div>
                  <div class="radar-core">py</div>
                </div>
              </div>

              <div>
                <p class="panel-copy">My default tool for test automation, quality tooling, scripts and the practical glue that keeps delivery moving.</p>
                <ul class="panel-bullets"><li>Automation frameworks and reusable tooling</li><li>Test infrastructure and diagnostics</li><li>Fast scripting for developer workflows</li></ul>
              </div>
            </div>
          </div>
        </section>
      </main>

      <section class="dock panel-surface">
        <div>
          <p class="eyebrow">signals</p>
          <div class="signal-grid">
        <article class="signal-card">
          <strong>5+</strong>
          <span>years in QA</span>
        </article>
      
        <article class="signal-card">
          <strong>3500+</strong>
          <span>automated tests</span>
        </article>
      
        <article class="signal-card">
          <strong>20+</strong>
          <span>pipelines</span>
        </article>
      
        <article class="signal-card">
          <strong>QA x DevOps</strong>
          <span>focus</span>
        </article>
      </div>
        </div>

        <div>
          <p class="eyebrow">links</p>
          <div class="links"><div class="link-pill">GitHub</div><div class="link-pill">Profile README</div></div>
        </div>
      </section>

      <footer class="footer panel-surface">
        <span>private interactive source / public static view</span>
        <span class="footer-separator">/</span>
        <span>static view generated from shared data</span>
      </footer>
    </div>
  </foreignObject>
</svg>
