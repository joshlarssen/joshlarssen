<svg width="1200" height="940" viewBox="0 0 1200 940" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="940" gradientUnits="userSpaceOnUse">
              <stop stop-color="#030703" />
              <stop offset="1" stop-color="#071109" />
            </linearGradient>
            <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
              <rect width="6" height="3" fill="#0E200F" opacity="0.2" />
            </pattern>
            <style><![CDATA[
        :root {
  color-scheme: dark;
  --shell-width: 1136px;
  --shell-height: 876px;
  --topbar-height: 112px;
  --screen-height: 534px;
  --dock-height: 176px;
  --footer-height: 54px;
  --bg-start: #030603;
  --bg-end: #050b05;
  --panel: rgba(7, 19, 9, 0.94);
  --line: #2f9134;
  --line-soft: rgba(76, 180, 80, 0.22);
  --text: #9dff7b;
  --text-strong: #6dff55;
  --text-dim: #62c964;
  --text-faint: #2f6a33;
  --shadow: rgba(57, 255, 20, 0.18);
  --surface-glow: rgba(109, 255, 85, 0.08);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  background:
    radial-gradient(circle at top, rgba(39, 120, 44, 0.15), transparent 32%),
    linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
  color: var(--text);
}

body {
  position: relative;
  overflow-x: hidden;
}

.crt {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(rgba(255, 255, 255, 0.03) 50%, rgba(0, 0, 0, 0.08) 50%),
    linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.02));
  background-size: 100% 6px, 8px 100%;
  opacity: 0.15;
}

.shell {
  width: min(100%, var(--shell-width));
  max-width: var(--shell-width);
  margin: 0 auto;
  padding: 28px 18px 40px;
}

.topbar,
.screen,
.dock,
.footer {
  border: 1px solid var(--line);
  background: var(--panel);
  box-shadow: 0 0 30px var(--shadow), inset 0 0 0 1px rgba(67, 183, 66, 0.12);
}

.topbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 18px;
  align-items: center;
  height: var(--topbar-height);
  padding: 18px 22px;
  border-radius: 18px 18px 0 0;
}

.brand {
  display: flex;
  gap: 14px;
  align-items: center;
  min-width: 0;
}

.brand > div {
  min-width: 0;
}

.brand-led {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--text-strong);
  box-shadow: 0 0 18px rgba(109, 255, 85, 0.85);
}

.brand-kicker,
.eyebrow {
  margin: 0;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.18em;
  font-size: 0.72rem;
}

.brand-title,
.sidebar-title,
.panel-title {
  margin: 2px 0 0;
  color: var(--text-strong);
}

.brand-title {
  max-width: 100%;
  font-size: clamp(1.15rem, 2.1vw, 1.72rem);
  line-height: 1.15;
}

.module-tabs {
  display: flex;
  flex-wrap: nowrap;
  gap: 10px;
  justify-content: flex-end;
  min-width: 0;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.module-tabs::-webkit-scrollbar {
  display: none;
}

.tab-button,
.item-button,
.link-pill {
  border: 1px solid var(--line);
  background: rgba(7, 18, 8, 0.9);
  color: var(--text);
  font: inherit;
  cursor: pointer;
  transition: 140ms ease;
  text-decoration: none;
}

.tab-button {
  flex: 0 0 auto;
  padding: 10px 14px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  white-space: nowrap;
}

.tab-button:hover,
.tab-button:focus-visible,
.tab-button.is-active,
.item-button:hover,
.item-button:focus-visible,
.item-button.is-active,
.link-pill:hover,
.link-pill:focus-visible {
  background: var(--text-strong);
  color: #041006;
  box-shadow: 0 0 18px rgba(102, 255, 68, 0.26);
  outline: none;
}

.screen {
  display: grid;
  grid-template-columns: minmax(250px, 320px) minmax(0, 1fr);
  gap: 18px;
  height: var(--screen-height);
  padding: 18px;
  border-top: none;
}

.sidebar,
.panel-frame,
.dock {
  border: 1px solid var(--line-soft);
}

.sidebar {
  min-height: 0;
  padding: 18px;
  background:
    linear-gradient(180deg, rgba(15, 31, 16, 0.76), rgba(5, 13, 6, 0.92)),
    linear-gradient(180deg, transparent, rgba(109, 255, 85, 0.04));
  overflow: hidden;
}

.item-list {
  display: grid;
  gap: 10px;
  margin-top: 18px;
  max-height: calc(100% - 56px);
  overflow-y: auto;
  padding-right: 4px;
  scrollbar-width: thin;
}

.item-button {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 14px;
}

.item-button__index {
  color: var(--text-faint);
}

.item-button.is-active .item-button__index {
  color: rgba(4, 16, 6, 0.75);
}

.panel-frame {
  height: 100%;
  padding: 22px;
  background:
    linear-gradient(180deg, rgba(8, 18, 8, 0.94), rgba(3, 8, 4, 0.97)),
    linear-gradient(90deg, transparent, rgba(109, 255, 85, 0.03), transparent);
  overflow: hidden;
}

.panel-meta {
  display: flex;
  gap: 18px;
  justify-content: space-between;
  align-items: flex-start;
}

.panel-title {
  font-size: clamp(2rem, 4vw, 3.5rem);
  line-height: 1;
}

.panel-subtitle,
.panel-copy {
  color: var(--text-dim);
  line-height: 1.7;
}

.panel-subtitle {
  margin: 12px 0 0;
  max-width: 34rem;
}

.panel-tag {
  padding: 8px 12px;
  border: 1px solid var(--line);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  white-space: nowrap;
}

.panel-body {
  margin-top: 28px;
  height: calc(100% - 118px);
}

.panel-copy {
  margin: 0;
  max-width: 52rem;
  font-size: 1.02rem;
}

.panel-links[hidden] {
  display: none;
}

.panel-link-card {
  display: grid;
  gap: 10px;
  margin-top: 18px;
  padding: 14px 16px;
  border: 1px solid var(--line-soft);
  background: rgba(8, 18, 8, 0.72);
}

.panel-link-header {
  display: flex;
  align-items: center;
  gap: 12px;
}

.panel-link-title {
  color: var(--text-strong);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: 0.86rem;
}

.panel-link-row {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 10px 14px;
}

.panel-link-key {
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 0.72rem;
}

.panel-link-value,
.panel-link-anchor {
  color: var(--text-strong);
  word-break: break-word;
}

.panel-link-anchor {
  text-decoration: none;
}

.panel-link-anchor:hover,
.panel-link-anchor:focus-visible {
  text-decoration: underline;
  outline: none;
}

.link-icon {
  min-width: 2.3rem;
  height: 2.3rem;
  display: inline-grid;
  place-items: center;
  padding: 0 0.45rem;
  border: 1px solid var(--line);
  border-radius: 0.45rem;
  background: rgba(7, 18, 8, 0.9);
  color: var(--text-strong);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  line-height: 1;
  box-shadow: inset 0 0 0 1px var(--surface-glow);
}

.detail-block {
  height: 100%;
  overflow-y: auto;
  padding-right: 6px;
  scrollbar-width: thin;
}

.panel-bullets {
  margin: 18px 0 0;
  padding-left: 18px;
  color: var(--text);
  line-height: 1.8;
}

.dock {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 18px;
  height: var(--dock-height);
  margin-top: 18px;
  padding: 18px 20px;
  border-top: none;
}

.signal-cards {
  display: grid;
  grid-template-columns: repeat(var(--signal-count, 1), minmax(0, 1fr));
  gap: 12px;
  margin-top: 12px;
}

.signal-card {
  min-width: 0;
  padding: 14px;
  border: 1px solid var(--line-soft);
  background: rgba(8, 18, 8, 0.72);
}

.signal-card strong {
  display: block;
  color: var(--text-strong);
  font-size: 1.2rem;
  margin-bottom: 6px;
}

.signal-card span {
  color: var(--text-dim);
  line-height: 1.5;
}

.link-pills {
  display: flex;
  flex-wrap: nowrap;
  gap: 10px;
  margin-top: 12px;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.link-pills::-webkit-scrollbar {
  display: none;
}

.link-pill {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
}

.link-pill__label {
  white-space: nowrap;
}

.footer {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  min-height: var(--footer-height);
  padding: 12px 18px;
  border-top: none;
  border-radius: 0 0 18px 18px;
  color: var(--text-dim);
}

.footer-separator {
  color: var(--text-faint);
}

@media (max-width: 960px) {
  :root {
    --topbar-height: auto;
    --screen-height: auto;
    --dock-height: auto;
    --footer-height: auto;
  }

  .topbar,
  .screen,
  .dock {
    display: grid;
    grid-template-columns: 1fr;
    height: auto;
  }

  .module-tabs {
    justify-content: flex-start;
  }

  .panel-meta {
    display: grid;
  }

  .item-list,
  .detail-block {
    max-height: none;
    height: auto;
    overflow: visible;
    padding-right: 0;
  }

  .link-pills {
    flex-wrap: wrap;
    overflow: visible;
  }

  .signal-cards {
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  }
}

@media (max-width: 640px) {
  .shell {
    padding: 14px 10px 24px;
  }

  .topbar,
  .screen,
  .dock,
  .panel-frame,
  .sidebar {
    padding: 14px;
  }
}

        .page, .page * {
          box-sizing: border-box;
        }

        .page {
          width: 1136px;
          height: 876px;
          color: var(--text);
          font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
        }

        .page .crt {
          display: none;
        }

        .page .shell {
          max-width: none;
          margin: 0;
          padding: 0;
        }

        .page .tab-button,
        .page .item-button,
        .page .link-pill {
          cursor: default;
        }

        .page .link-pill {
          pointer-events: none;
        }
        ]]></style>
          </defs>

          <rect x="14" y="14" width="1172" height="912" rx="18" fill="url(#bg)" stroke="#57FF3A" stroke-width="2" />
          <rect x="28" y="28" width="1144" height="884" rx="14" fill="#040904" stroke="#1D5724" stroke-width="1.5" />
          <rect x="28" y="28" width="1144" height="884" rx="14" fill="url(#scan)" opacity="0.85" />

          <foreignObject x="32" y="32" width="1136" height="876">
            <div xmlns="http://www.w3.org/1999/xhtml" class="page" style="--bg-start:#030603;--bg-end:#050b05;--panel:rgba(7, 19, 9, 0.94);--line:#2f9134;--line-soft:rgba(76, 180, 80, 0.22);--text:#9dff7b;--text-strong:#6dff55;--text-dim:#62c964;--text-faint:#2f6a33;--shadow:rgba(57, 255, 20, 0.18)">
              <div class="shell">
                <header class="topbar">
                  <div class="brand">
                    <span class="brand-led"></span>
                    <div>
